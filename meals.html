<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>오늘의 식단 — 어르신용 건강 식단 추천</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    html, body { margin:0; padding:0; background:#EBE2D2; min-height:100vh;
      font-family: 'Noto Sans KR', -apple-system, system-ui, sans-serif; }
    body { display:flex; align-items:center; justify-content:center; padding:80px 32px 100px; box-sizing:border-box; }
    #root { width:100%; max-width:520px; }
    .phone-scroll::-webkit-scrollbar { width: 0; height: 0; }
    .phone-scroll { scrollbar-width: none; }
    .tappable { transition: transform 80ms ease, filter 80ms ease; cursor: pointer; -webkit-tap-highlight-color: transparent; user-select:none; }
    .tappable:active { transform: scale(0.97); filter: brightness(0.96); }
    @keyframes pulse-ring {
      0% { transform: scale(0.85); opacity: 0.55; }
      80% { transform: scale(1.4); opacity: 0; }
      100% { transform: scale(1.4); opacity: 0; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes pop { 0% { opacity: 0; transform: scale(0.85); } 100% { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <script type="text/babel" data-presets="react">
  // ─────────────────────────────────────────────────────────────
  // iOS 26 (Liquid Glass) device frame — minimal subset used here
  // ─────────────────────────────────────────────────────────────
  function IOSStatusBar({ dark = false, time = '9:41' }) {

    return (

        display: 'flex', gap: 154, alignItems: 'center', justifyContent: 'center',

        position: 'relative', zIndex: 20, width: '100%',
      }}>

          </svg>
          <svg width="17" height="12" viewBox="0 0 17 12">
            <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill={c}/>
            <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill={c}/>
            <circle cx="8.5" cy="10.5" r="1.5" fill={c}/>
          </svg>
          <svg width="27" height="13" viewBox="0 0 27 13">
            <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke={c} strokeOpacity="0.35" fill="none"/>

            <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c} fillOpacity="0.4"/>
          </svg>
        </div>
      </div>
    );
  }

  function IOSDevice({ children, width = 402, height = 874, dark = false }) {
    return (
      <div style={{
        width, height, borderRadius: 48, overflow: 'hidden',
        position: 'relative', background: dark ? '#000' : '#F2F2F7',
        boxShadow: '0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12)',
        fontFamily: '-apple-system, system-ui, sans-serif',
        WebkitFontSmoothing: 'antialiased',
      }}>
        <div style={{
          position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
          width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
        }} />
        <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10 }}>
          <IOSStatusBar dark={dark} />
        </div>
        <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
          <div style={{ flex: 1, overflow: 'auto' }}>{children}</div>
        </div>
        <div style={{
          position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60,
          height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
          paddingBottom: 8, pointerEvents: 'none',
        }}>
          <div style={{
            width: 139, height: 5, borderRadius: 100,
            background: dark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.25)',
          }} />
        </div>
      </div>
    );
  }

  // ─────────────────────────────────────────────────────────────
  // Tweaks panel — hidden by default, opens with Cmd/Ctrl+`
  // ─────────────────────────────────────────────────────────────
  const __TWEAKS_STYLE = `
    .twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:280px;
      max-height:calc(100vh - 32px);display:flex;flex-direction:column;
      background:rgba(250,249,247,.78);color:#29261b;
      -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
      border:.5px solid rgba(255,255,255,.6);border-radius:14px;
      box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 12px 40px rgba(0,0,0,.18);
      font:11.5px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}
    .twk-hd{display:flex;align-items:center;justify-content:space-between;
      padding:10px 8px 10px 14px;user-select:none}
    .twk-hd b{font-size:12px;font-weight:600;letter-spacing:.01em}
    .twk-x{appearance:none;border:0;background:transparent;color:rgba(41,38,27,.55);
      width:22px;height:22px;border-radius:6px;cursor:pointer;font-size:13px;line-height:1}
    .twk-x:hover{background:rgba(0,0,0,.06);color:#29261b}
    .twk-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;
      overflow-y:auto;overflow-x:hidden;min-height:0}
    .twk-row{display:flex;flex-direction:column;gap:5px}

      color:rgba(41,38,27,.45);padding:10px 0 0}
    .twk-sect:first-child{padding-top:0}
    .twk-seg{position:relative;display:flex;padding:2px;border-radius:8px;

    .twk-seg-thumb{position:absolute;top:2px;bottom:2px;border-radius:6px;

      transition:left .15s cubic-bezier(.3,.7,.4,1),width .15s}
    .twk-seg button{appearance:none;position:relative;z-index:1;flex:1;border:0;
      background:transparent;color:inherit;font:inherit;font-weight:500;min-height:22px;
      border-radius:6px;cursor:pointer;padding:4px 6px;line-height:1.2}
    .twk-btn{appearance:none;height:26px;padding:0 12px;border:0;border-radius:7px;
      background:rgba(0,0,0,.78);color:#fff;font:inherit;font-weight:500;cursor:pointer}
    .twk-btn:hover{background:rgba(0,0,0,.88)}
    .twk-btn.secondary{background:rgba(0,0,0,.06);color:inherit}
    .twk-btn.secondary:hover{background:rgba(0,0,0,.1)}
  `;

  function useTweaks(defaults) {
    const [values, setValues] = React.useState(defaults);
    const setTweak = React.useCallback((keyOrEdits, val) => {
      const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
        ? keyOrEdits : { [keyOrEdits]: val };
      setValues((prev) => ({ ...prev, ...edits }));
    }, []);
    return [values, setTweak];
  }

  function TweaksPanel({ title = 'Tweaks', children }) {
    const [open, setOpen] = React.useState(false);
    React.useEffect(() => {
      const onKey = (e) => {
        if (e.key === '`' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); setOpen(o => !o); }
      };
      window.addEventListener('keydown', onKey);
      return () => window.removeEventListener('keydown', onKey);
    }, []);
    if (!open) return null;
    return (
      <>
        <style>{__TWEAKS_STYLE}</style>
        <div className="twk-panel">
          <div className="twk-hd">
            <b>{title}</b>
            <button className="twk-x" aria-label="닫기" onClick={() => setOpen(false)}>✕</button>
          </div>
          <div className="twk-body">{children}</div>
        </div>
      </>
    );
  }

  function TweakSection({ label }) { return <div className="twk-sect">{label}</div>; }

  function TweakRadio({ label, value, options, onChange }) {
    const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
    const idx = Math.max(0, opts.findIndex((o) => o.value === value));
    const n = opts.length;
    return (
      <div className="twk-row">
        <div className="twk-lbl"><span>{label}</span></div>
        <div role="radiogroup" className="twk-seg">
          <div className="twk-seg-thumb"
               style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                        width: `calc((100% - 4px) / ${n})` }} />
          {opts.map((o) => (
            <button key={o.value} type="button" role="radio" aria-checked={o.value === value}
                    onClick={() => onChange(o.value)}>{o.label}</button>
          ))}
        </div>
      </div>
    );
  }

  function TweakButton({ label, onClick, secondary = false }) {
    return (
      <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
              onClick={onClick}>{label}</button>
    );
  }

      case 'speaker':

        return <svg width={size} height={size} viewBox="0 0 24 24"><path {...p} d="M15 5l-7 7 7 7"/></svg>;
      case 'refresh':

      case 'check':

      case 'message':
        return <svg width={size} height={size} viewBox="0 0 24 24"><path {...p} d="M4 5h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H8l-4 4V6a1 1 0 0 1 1-1z"/></svg>;

        return <svg width={size} height={size} viewBox="0 0 24 24"><path {...p} d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/></svg>;

      default: return null;
    }
  }

  function speak(text, onEnd) {
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR'; u.rate = 0.88; u.pitch = 1.0;
      u.onend = () => onEnd && onEnd();
      window.speechSynthesis.speak(u);
    } catch (e) { onEnd && onEnd(); }
  }
  function stopSpeaking() { try { window.speechSynthesis.cancel(); } catch (e) {} }

  function SpeakerButton({ text, palette, size = 56, label = '음성으로 읽어드릴까요?' }) {
    const [on, setOn] = React.useState(false);
    React.useEffect(() => () => stopSpeaking(), []);
    const toggle = () => {
      if (on) { stopSpeaking(); setOn(false); return; }
      setOn(true);
      speak(text, () => setOn(false));
    };
    return (
      <button onClick={toggle} aria-label={label} className="tappable"
        style={{
          display: 'inline-flex', alignItems: 'center', gap: 10,
          height: size, padding: '0 18px 0 14px',
          background: on ? palette.accent : palette.card,
          color: on ? '#fff' : palette.ink,
          border: `2px solid ${on ? palette.accent : palette.line}`,
          borderRadius: size / 2,
          fontSize: 19, fontWeight: 700,
          boxShadow: on ? `0 4px 0 ${palette.accentDeep}` : `0 3px 0 ${palette.line}`,
        }}>
        <span style={{
          width: size - 18, height: size - 18, borderRadius: '50%',
          background: on ? '#fff' : palette.accentSoft,
          color: on ? palette.accent : palette.accentDeep,
          display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
          position: 'relative',
        }}>
          {on && (<span style={{
            position:'absolute', inset:0, borderRadius:'50%',
            border:`3px solid ${palette.accent}`, animation: 'pulse-ring 1.4s ease-out infinite',
          }}/>)}
          <Icon name={on ? 'speaker-on' : 'speaker'} size={22} stroke={2.5}/>
        </span>
        {on ? '읽는 중… (탭하면 멈춰요)' : '읽어드릴까요?'}
      </button>
    );
  }

  // ─────────────────────────────────────────────────────────────

            <div style={{ fontSize: 56, animation: 'pop 0.5s ease' }}>👇</div>
            <div style={{
              padding: '6px 18px', borderRadius: 999,
              background: p.accent, color: '#fff',
              fontSize: f.base - 6, fontWeight: 800,
            }}>여기를 한 번만 누르세요</div>
            <div style={{
              fontSize: f.btn + 4, fontWeight: 800, color: p.ink,
              lineHeight: 1.2, textAlign: 'center', letterSpacing: '-0.01em',
            }}>
              오늘은<br/><span style={{ color: p.accentDeep }}>뭐 드실까요?</span>
            </div>
          </button>
        </div>
        <div style={{
          marginTop: 26, padding: '16px 18px',
          background: p.cardSoft, borderRadius: 18,
          border: `2px dashed ${p.line}`,
          fontSize: f.base - 4, color: p.inkSoft, fontWeight: 700, lineHeight: 1.6,
          textAlign: 'center',
        }}>
          💝 할머니 건강 생각해서<br/>싱겁고 든든한 걸로 골라드려요
        </div>
        {recent.length > 0 && (
          <div style={{ marginTop: 'auto', paddingTop: 26 }}>
            <div style={{ fontSize: f.base - 6, color: p.inkSoft, fontWeight: 800, marginBottom: 10, paddingLeft: 4 }}>
              지난번엔 이거 드셨어요
            </div>
            <div style={{ display: 'flex', gap: 8, overflowX: 'auto' }}>
              {recent.slice(0, 3).map((m, i) => (
                <div key={m.id} style={{
                  flexShrink: 0, padding: '10px 14px',
                  background: '#fff', borderRadius: 14,
                  border: `2px solid ${p.line}`,
                  fontSize: f.base - 6, fontWeight: 700, color: p.ink,
                  transform: `rotate(${i % 2 === 0 ? -1 : 1}deg)`,
                  display: 'flex', alignItems: 'center', gap: 6,
                }}>
                  <span style={{ fontSize: 18 }}>{m.plate[0]}</span>{m.short}
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    );
  }

  function FriendlyLoading({ p, f, onDone }) {
    React.useEffect(() => { const t = setTimeout(onDone, 1700); return () => clearTimeout(t); }, [onDone]);
    const msgs = ['음… 뭐가 좋을까요', '오늘은 이게 좋겠어요!'];
    const [i, setI] = React.useState(0);
    React.useEffect(() => { const t = setInterval(() => setI(v => (v+1) % msgs.length), 700); return () => clearInterval(t); }, []);
    return (
      <div style={{
        minHeight: '100%', background: p.bg, fontFamily: FRIENDLY_FONT,
        padding: '0 28px', display: 'flex', flexDirection: 'column',
        alignItems: 'center', justifyContent: 'center', gap: 24,
      }}>
        <div style={{ position: 'relative', display: 'flex', alignItems: 'center', gap: 16 }}>
          <GrandchildSticker p={p} size={84} mood="chef"/>
        </div>
        <FriendlyBubble p={p} f={f} bg="#fff">{msgs[i]}</FriendlyBubble>
        <div style={{ display:'flex', gap: 8 }}>
          {[0,1,2].map(d => (
            <div key={d} style={{
              width: 12, height: 12, borderRadius: '50%', background: p.accent,
              animation: `pop 0.8s ${d * 0.15}s infinite alternate`,
            }}/>
          ))}
        </div>
      </div>
    );
  }

  function FriendlyResult({ p, f, meal, nav, onAnother }) {
    return (
      <div style={{
        minHeight: '100%', background: p.bg, fontFamily: FRIENDLY_FONT,
        padding: '70px 22px 32px', boxSizing: 'border-box',
      }}>
        <div className="tappable" onClick={() => nav('home')} style={{
          display:'inline-flex', alignItems:'center', gap:6, padding:'10px 14px', marginLeft:-8,
          color: p.ink, fontWeight: 800, fontSize: f.base - 4,
        }}>
          <Icon name="back" size={22} color={p.ink} stroke={2.5}/> 처음
        </div>
        <div style={{ display: 'flex', gap: 12, alignItems: 'flex-start', marginTop: 6, animation: 'rise 0.4s ease' }}>
          <GrandchildSticker p={p} size={60} mood="wink"/>
          <div style={{ flex: 1 }}>
            <FriendlyBubble p={p} f={f}>
              할머니, 오늘은<br/>
              <span style={{ color: p.accentDeep, fontWeight: 800, fontSize: f.body }}>이거 어떠세요?</span>
            </FriendlyBubble>
          </div>
        </div>
        <div style={{ marginTop: 22, position: 'relative', animation: 'pop 0.5s 0.15s both' }}>
          <div style={{
            position:'absolute', inset: 0,
            background: meal.accent, borderRadius: 32,
            transform: 'rotate(-2deg) translate(6px, 8px)',
          }}/>
          <div style={{
            position:'relative',
            background: '#fff', borderRadius: 32, padding: '28px 22px',
            border: `3px solid ${p.accentDeep}`,
            boxShadow: `0 6px 0 ${p.accentDeep}`,
          }}>
            <div style={{
              position: 'absolute', top: -16, right: 18,
              padding: '10px 18px', background: meal.accent, color: '#fff',
              borderRadius: 999, fontSize: 17, fontWeight: 900,
              border: `3px solid #fff`,
              boxShadow: `0 4px 0 ${p.accentDeep}50`,
              transform: 'rotate(6deg)',
            }}>{meal.tag}</div>
            <div style={{ display: 'flex', justifyContent: 'center', marginTop: 6 }}>
              <MealPlate meal={meal} p={p} size={210}/>
            </div>
            <div style={{
              marginTop: 22, textAlign: 'center',
              fontSize: f.title - 4, fontWeight: 800, color: p.ink, lineHeight: 1.15,
              letterSpacing: '-0.01em',
            }}>{meal.name}</div>
            <div style={{
              marginTop: 16, padding: '16px 18px',
              background: p.cardSoft, borderRadius: 18,
              textAlign: 'center',
              fontSize: f.body - 6, color: p.ink, fontWeight: 700, lineHeight: 1.5,
              whiteSpace: 'pre-line', border: `2px dashed ${p.accent}`,
            }}>
              <div style={{ fontSize: 26, marginBottom: 4 }}>💛</div>
              {meal.benefit}
            </div>
            <div style={{ display: 'flex', justifyContent: 'space-around', marginTop: 18, gap: 10 }}>
              {[
                { ic: '⏱️', label: meal.time },
                { ic: '🔥', label: `${meal.kcal}kcal` },
                { ic: '🧂', label: `${meal.na}mg` },
              ].map((info, i) => (
                <div key={i} style={{ textAlign: 'center' }}>
                  <div style={{ fontSize: 28 }}>{info.ic}</div>
                  <div style={{ fontSize: f.base - 6, fontWeight: 800, color: p.ink, marginTop: 2 }}>{info.label}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
        <div style={{ marginTop: 22, display:'flex', justifyContent: 'center' }}>
          <SpeakerButton palette={p} size={60}
            text={`할머니, 오늘은 ${meal.name}이 어떠세요? ${meal.why}`}/>
        </div>
        <button onClick={() => nav('detail')} className="tappable" style={{
          marginTop: 16, width: '100%', padding: '22px 18px',
          background: p.accent, color: '#fff',
          border: `3px solid ${p.accentDeep}`, borderRadius: 22,
          fontFamily: FRIENDLY_FONT, fontSize: f.btn - 2, fontWeight: 800,
          boxShadow: `0 6px 0 ${p.accentDeep}`,
        }}>만드는 법 알려드릴까요? 📖</button>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginTop: 10 }}>
          <button onClick={() => nav('share')} className="tappable" style={{
            padding: '18px 12px', background: '#fff', color: p.ink,
            border: `2.5px solid ${p.accentDeep}`, borderRadius: 18,
            fontFamily: FRIENDLY_FONT, fontSize: f.base - 4, fontWeight: 800,
            boxShadow: `0 4px 0 ${p.accentDeep}50`,
          }}>가족한테<br/>알리기 💌</button>
          <button onClick={onAnother} className="tappable" style={{
            padding: '18px 12px', background: '#fff', color: p.ink,
            border: `2.5px solid ${p.accentDeep}`, borderRadius: 18,
            fontFamily: FRIENDLY_FONT, fontSize: f.base - 4, fontWeight: 800,
            boxShadow: `0 4px 0 ${p.accentDeep}50`,
          }}>다른 거<br/>골라볼까요? 🔄</button>
        </div>
      </div>
    );
  }

  function FriendlyDetail({ p, f, meal, nav }) {
    return (
      <div style={{
        minHeight: '100%', background: p.bg, fontFamily: FRIENDLY_FONT,
        padding: '70px 22px 40px', boxSizing: 'border-box',
      }}>
        <div className="tappable" onClick={() => nav('result')} style={{
          display:'inline-flex', alignItems:'center', gap:6, padding:'10px 14px', marginLeft:-8,
          color: p.ink, fontWeight: 800, fontSize: f.base - 4,
        }}>
          <Icon name="back" size={22} color={p.ink} stroke={2.5}/> 추천 결과
        </div>
        <div style={{ display: 'flex', gap: 14, alignItems:'flex-start', marginTop: 6 }}>
          <GrandchildSticker p={p} size={60} mood="chef"/>
          <div style={{ flex: 1 }}>
            <FriendlyBubble p={p} f={f}>
              <b>{meal.short}</b> 만드는 법<br/>천천히 알려드릴게요!
            </FriendlyBubble>
          </div>
        </div>
        <div style={{
          marginTop: 22, position: 'relative',
          background: '#FFFDEB',
          border: `2.5px solid ${p.accentDeep}`,
          borderRadius: 20, padding: '22px 22px',
          boxShadow: `0 5px 0 ${p.accentDeep}40`,
          transform: 'rotate(-0.6deg)',
        }}>
          <div style={{ fontSize: f.big - 8, fontWeight: 800, color: p.ink, marginBottom: 12 }}>🛒 살 것</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
            {meal.ingredients.map(([k, v], i) => (
              <div key={i} style={{ display: 'flex', alignItems: 'baseline', gap: 12 }}>
                <span style={{
                  width: 26, height: 26, borderRadius: '50%',
                  border: `2.5px solid ${p.accentDeep}`,
                  display:'inline-flex', alignItems:'center', justifyContent:'center',
                  fontSize: 16, fontWeight: 900, color: p.accentDeep, flexShrink: 0,
                }}>✓</span>
                <span style={{ fontSize: f.base - 2, fontWeight: 800, color: p.ink }}>{k}</span>
                <span style={{ flex: 1, borderBottom: `1.5px dotted ${p.line}`, marginBottom: 6 }}/>
                <span style={{ fontSize: f.base - 6, fontWeight: 700, color: p.inkSoft }}>{v}</span>
              </div>
            ))}
          </div>
        </div>
        <div style={{ marginTop: 22, fontSize: f.big - 8, fontWeight: 800, color: p.ink, paddingLeft: 4, marginBottom: 12 }}>
          👩‍🍳 만드는 순서
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
          {meal.steps.map((s, i) => (
            <div key={i} style={{
              display: 'flex', gap: 14, alignItems: 'flex-start',
              padding: '18px 18px',
              background: '#fff',
              border: `2.5px solid ${p.accentDeep}`,
              borderRadius: 20,
              boxShadow: `0 4px 0 ${p.accentDeep}40`,
              transform: `rotate(${i % 2 === 0 ? -0.3 : 0.3}deg)`,
            }}>
              <div style={{
                width: 46, height: 46, borderRadius: '50%',
                background: p.accent, color: '#fff',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                fontSize: f.base, fontWeight: 900, flexShrink: 0,
                border: `3px solid #fff`,
                boxShadow: `0 2px 0 ${p.accentDeep}`,
              }}>{i + 1}</div>
              <div style={{ fontSize: f.body - 4, color: p.ink, fontWeight: 700, lineHeight: 1.5, paddingTop: 6 }}>
                {s}
              </div>
            </div>
          ))}
        </div>
        <div style={{ marginTop: 26, display: 'flex', gap: 12, alignItems: 'flex-start' }}>
          <GrandchildSticker p={p} size={56} mood="hug"/>
          <div style={{ flex: 1 }}>
            <FriendlyBubble p={p} f={f} bg={p.cardSoft}>
              천천히 만드세요!<br/>맛있게 드시고 건강하세요 ☺️
            </FriendlyBubble>
          </div>
        </div>
        <div style={{ marginTop: 22, display:'flex', justifyContent: 'center' }}>
          <SpeakerButton palette={p} size={58}
            text={`${meal.name} 만드는 법 알려드릴게요. ${meal.steps.map((s, i) => `${i+1}단계. ${s}`).join(' ')}`}/>
        </div>
      </div>
    );
  }

  function FriendlyShare({ p, f, meal, nav }) {
    const [sent, setSent] = React.useState(null);
    const family = [
      { name: '큰딸 지영이', sub: '제일 자주 받아요', avatar: '👧', tone: '#E07A50' },
      { name: '아들 민준이', sub: '카카오톡', avatar: '👦', tone: '#5B8C3E' },
      { name: '며느리 수진이', sub: '저번에도 보냈어요', avatar: '🧑', tone: '#7355B5' },
      { name: '손녀 서아', sub: '문자', avatar: '👶', tone: '#D9A03D' },
    ];
    return (
      <div style={{
        minHeight: '100%', background: p.bg, fontFamily: FRIENDLY_FONT,
        padding: '70px 22px 40px', boxSizing: 'border-box',
      }}>
        <div className="tappable" onClick={() => nav('result')} style={{
          display:'inline-flex', alignItems:'center', gap:6, padding:'10px 14px', marginLeft:-8,
          color: p.ink, fontWeight: 800, fontSize: f.base - 4,
        }}>
          <Icon name="back" size={22} color={p.ink} stroke={2.5}/> 뒤로
        </div>
        <div style={{ display: 'flex', gap: 12, marginTop: 6, alignItems: 'flex-start' }}>
          <GrandchildSticker p={p} size={60} mood="wave"/>
          <div style={{ flex: 1 }}>
            <FriendlyBubble p={p} f={f}>
              누구한테<br/>
              <b style={{ color: p.accentDeep }}>자랑하실까요?</b> 💌
            </FriendlyBubble>
          </div>
        </div>
        <div style={{
          marginTop: 22, position: 'relative',
          background: '#fff', borderRadius: 22,
          border: `2.5px solid ${p.accentDeep}`,
          padding: '22px 22px',
          boxShadow: `0 5px 0 ${p.accentDeep}50`,
          transform: 'rotate(-0.8deg)',
        }}>
          <div style={{
            position: 'absolute', top: -10, right: 18,
            width: 50, height: 60, background: p.accent,
            border: `3px dashed #fff`, borderRadius: 6,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            fontSize: 28, color: '#fff',
            boxShadow: `0 2px 0 ${p.accentDeep}`,
          }}>💌</div>
          <div style={{ fontSize: f.base - 6, color: p.inkSoft, fontWeight: 800, letterSpacing: '0.05em' }}>
            오늘의 한마디
          </div>
          <div style={{ marginTop: 10, fontSize: f.base, color: p.ink, fontWeight: 700, lineHeight: 1.6 }}>
            오늘 점심은 <b style={{ color: p.accentDeep }}>{meal.short}</b>으로<br/>
            먹어볼까 해.<br/>
            {meal.benefit.split('\n').join(' ')} 🌿
          </div>
          <div style={{
            marginTop: 16, padding: '12px 14px',
            background: p.cardSoft, borderRadius: 12,
            display: 'flex', alignItems: 'center', gap: 10,
          }}>
            <div style={{
              width: 44, height: 44, borderRadius: '50%',
              background: meal.accent + '20',
              display:'flex', alignItems:'center', justifyContent:'center', fontSize: 24,
            }}>{meal.plate[0]}</div>
            <div style={{ fontSize: f.base - 6, fontWeight: 800, color: p.ink }}>
              {meal.name}<br/>
              <span style={{ color: p.inkSoft, fontSize: f.base - 8 }}>{meal.kcal}kcal · {meal.time}</span>
            </div>
          </div>
        </div>
        <div style={{
          marginTop: 22, fontSize: f.base - 4, fontWeight: 800, color: p.inkSoft, paddingLeft: 4,
        }}>받는 사람을 골라주세요</div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginTop: 12 }}>
          {family.map((member) => {
            const isSent = sent === member.name;
            return (
              <button key={member.name}
                onClick={() => { setSent(member.name); setTimeout(() => setSent(null), 2400); }}
                className="tappable"
                style={{
                  display: 'flex', alignItems: 'center', gap: 14,
                  padding: '14px 16px',
                  background: isSent ? p.accentSoft : '#fff',
                  border: `2.5px solid ${isSent ? p.accent : p.accentDeep}`,
                  borderRadius: 20,
                  fontFamily: FRIENDLY_FONT, textAlign: 'left', width: '100%',
                  boxShadow: `0 4px 0 ${p.accentDeep}40`,
                }}>
                <div style={{
                  width: 56, height: 56, borderRadius: '50%', flexShrink: 0,
                  background: '#FFE1C7', border: `3px solid ${member.tone}`,
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  fontSize: 32,
                }}>{member.avatar}</div>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: f.base, fontWeight: 800, color: p.ink }}>{member.name}</div>
                  <div style={{ fontSize: f.base - 8, color: p.inkSoft, fontWeight: 700, marginTop: 2 }}>
                    {member.sub}
                  </div>
                </div>
                {isSent ? (
                  <div style={{
                    display:'flex', flexDirection:'column', alignItems:'center', gap: 4,
                    color: p.accentDeep, fontWeight: 900, fontSize: f.base - 8,
                  }}>
                    <Icon name="check" size={28} color={p.accentDeep} stroke={3.5}/>
                    보냈어요!
                  </div>
                ) : (
                  <div style={{
                    padding: '10px 16px', background: p.accent, color: '#fff',
                    borderRadius: 999, fontSize: f.base - 6, fontWeight: 900,
                    border: `2px solid ${p.accentDeep}`,
                  }}>보내기 →</div>
                )}
              </button>
            );
          })}
        </div>
      </div>
    );
  }

  const FRIENDLY = { Home: FriendlyHome, Loading: FriendlyLoading, Result: FriendlyResult, Detail: FriendlyDetail, Share: FriendlyShare };

  // ─────────────────────────────────────────────────────────────
  // App — wires it all together
  // ─────────────────────────────────────────────────────────────
  const VARIANTS = {
    clean:    { label: '단정',  obj: CLEAN,    desc: '깔끔한 흰색 카드' },
    warm:     { label: '따뜻',  obj: WARM,     desc: '큰 접시 일러스트' },
    friendly: { label: '친근',  obj: FRIENDLY, desc: '손주가 골라준 듯' },
  };

  function App() {
    const [t, setTweak] = useTweaks({ variant: 'warm', fontScale: '크게', palette: 'beige' });
    const variant = VARIANTS[t.variant] || VARIANTS.warm;
    const screens = variant.obj;
    const palette = PALETTES[t.palette] || PALETTES.beige;
    const fontScale = FONT_SCALES[t.fontScale] || FONT_SCALES['크게'];

    const [screen, setScreen] = React.useState('home');
    const [meal, setMeal] = React.useState(MEALS[0]);
    const [recent, setRecent] = React.useState([]);

    React.useEffect(() => () => stopSpeaking(), []);
    React.useEffect(() => { stopSpeaking(); }, [t.variant]);

    const nav = (next) => { stopSpeaking(); setScreen(next); };

    const pickAndShow = () => {
      const next = pickMeal(meal && meal.id);
      setMeal(next);
      setRecent(prev => {
        const filtered = prev.filter(m => m.id !== next.id);
        return [next, ...filtered].slice(0, 5);
      });
      setScreen('result');
    };

    let body;
    if (screen === 'home') body = <screens.Home p={palette} f={fontScale} nav={nav} recent={recent}/>;
    else if (screen === 'loading') body = <screens.Loading p={palette} f={fontScale} onDone={pickAndShow}/>;
    else if (screen === 'result') body = <screens.Result p={palette} f={fontScale} meal={meal} nav={nav} onAnother={() => nav('loading')}/>;
    else if (screen === 'detail') body = <screens.Detail p={palette} f={fontScale} meal={meal} nav={nav}/>;
    else if (screen === 'share') body = <screens.Share p={palette} f={fontScale} meal={meal} nav={nav}/>;

    return (
      <div style={{ width: '100%', display: 'flex', justifyContent: 'center' }}>
        <div style={{ position: 'relative' }}>
          <IOSDevice width={402} height={874}>
            <div className="phone-scroll" style={{ height: '100%', overflowY: 'auto', overflowX: 'hidden' }}>
              {body}
            </div>
          </IOSDevice>
        </div>

        <TweaksPanel title="Tweaks · 식단 추천">
          <TweakSection label="디자인 변형"/>
          <TweakRadio
            label="화면 분위기"
            value={t.variant}
            options={[
              { label: '단정', value: 'clean' },
              { label: '따뜻', value: 'warm' },
              { label: '친근', value: 'friendly' },
            ]}
            onChange={v => setTweak('variant', v)}
          />
          <TweakSection label="글씨 크기"/>
          <TweakRadio
            label="크기"
            value={t.fontScale}
            options={['보통', '크게', '아주 크게']}
            onChange={v => setTweak('fontScale', v)}
          />
          <TweakSection label="색상 톤"/>
          <div style={{ display: 'flex', gap: 8 }}>
            {Object.entries(PALETTES).map(([k, pal]) => (
              <button key={k} onClick={() => setTweak('palette', k)}
                style={{
                  flex: 1, padding: 6, borderRadius: 10,
                  border: t.palette === k ? '2px solid #29261b' : '1px solid rgba(0,0,0,0.12)',
                  background: 'transparent', cursor: 'pointer',
                }}>
                <div style={{ display: 'flex', gap: 3, marginBottom: 4 }}>
                  <div style={{ flex: 1, height: 18, background: pal.bg, borderRadius: 4 }}/>
                  <div style={{ flex: 1, height: 18, background: pal.accent, borderRadius: 4 }}/>
                  <div style={{ flex: 1, height: 18, background: pal.accentDeep, borderRadius: 4 }}/>
                </div>
                <div style={{ fontSize: 10, fontWeight: 600 }}>{pal.label}</div>
              </button>
            ))}
          </div>
          <TweakSection label="화면 이동"/>
          <TweakButton label="🏠 홈으로" onClick={() => nav('home')}/>
          <TweakButton label="🍽️ 추천 결과로" onClick={pickAndShow} secondary/>
        </TweaksPanel>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
